name: rust

on:
  push:
    branches: ["**"]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      # GPUI 的 Linux 传递依赖 xattr 0.2.3 与新版 libc 不兼容（ENOATTR 消失），
      # 且该 GUI 的交接目标是 Windows 版 BoxSend——Linux 只检查核心库与 CLI。
      - name: clippy（Linux：核心库 + CLI）
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --exclude bsend-gui -- -D warnings
      - name: test（Linux：核心库 + CLI）
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude bsend-gui
      - name: clippy（Windows：全部 crate，含 GPUI GUI）
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test（Windows：全部 crate）
        if: runner.os == 'Windows'
        run: cargo test --workspace

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check -p bsend -p bsend-cli

  coverage:
    name: 覆盖率（核心库 + CLI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude bsend-gui --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: rust/lcov.info
