name: rust-release

# Rust 版产物出包：打 v* tag 时构建 CLI + GUI 并挂到 Release。
# 旧 release.yml 是 Swift/.NET 遗留流水线，两者互不影响。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag（手动触发时必填，如 v0.2.0）"
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: rust

jobs:
  build-windows:
    name: windows-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: 测试（Windows 全量）
        run: cargo test --workspace

      - name: 构建 CLI
        run: cargo build --release -p bsend-cli

      - name: 构建 GUI
        # gui-release profile 走运行时着色器编译，避免 CI 缺 fxc.exe（Windows SDK）
        run: cargo build --profile gui-release -p bsend-gui

      - name: 冒烟（CLI 能启动并打印版本）
        run: |
          target\release\bsend.exe --version
          Get-Item target\release\bsend.exe | Select-Object Name, Length
          Get-Item target\gui-release\bsend-gui.exe | Select-Object Name, Length

      - name: 整理产物
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\bsend.exe dist\bsend.exe
          Copy-Item target\gui-release\bsend-gui.exe dist\bsend-gui.exe
          $cli = (Get-FileHash dist\bsend.exe -Algorithm SHA256).Hash.ToLower()
          $gui = (Get-FileHash dist\bsend-gui.exe -Algorithm SHA256).Hash.ToLower()
          "bsend.exe  $cli" | Set-Content dist\SHA256SUMS.txt -Encoding utf8
          "bsend-gui.exe  $gui" | Add-Content dist\SHA256SUMS.txt -Encoding utf8
          Get-Content dist\SHA256SUMS.txt

      - name: 上传构建产物（workflow artifact）
        uses: actions/upload-artifact@v4
        with:
          name: bsend-windows-${{ github.ref_name }}
          path: rust/dist/*
          if-no-files-found: error

      - name: 挂到 Release（tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust/dist/bsend.exe
            rust/dist/bsend-gui.exe
            rust/dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
