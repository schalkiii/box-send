[package]
name = "bsend"
description = "BoxSend 铺种引擎（Rust）：内容索引 → 源种定位 → 转种/辅种一体化"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart", "gzip", "cookies"] }
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
scraper = "0.20"
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
url = "2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
