[package]
name = "bsend"
description = "BoxSend 铺种引擎（Rust）：内容索引 → 源种定位 → 转种/辅种一体化"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart", "gzip", "cookies"] }
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
scraper = "0.20"
url = "2"
humantime = "2"
